name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ "master" ] # Pas dit aan naar "main" als je repository-branch zo heet
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Match jouw .NET versie

      - name: Publish app
        run: dotnet publish SofieNoraCampusBlazor.csproj -c Release -p:GHPages=true -o release_output

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release_output/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4